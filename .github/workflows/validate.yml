name: validate

on:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    timeout-minutes: 1
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.7"
      - name: Install dependencies
        run: uv sync --locked
      - name: Check Worker dependency lock
        run: |
          uv pip compile pyproject.toml --python-version 3.13 --python-platform wasm32-pyodide2025 \
            --no-build --index https://index.pyodide.org/0.28.3 --index-strategy unsafe-best-match \
            --emit-index-url -o pylock.toml
          git diff --exit-code -- pylock.toml
      - name: Validate catalog
        run: uv run python scripts/build_catalog.py --check
      - name: Tests
        run: uv run pytest -q
      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .
