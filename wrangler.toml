name = "ja-translation-todo"
main = "entry.py"
compatibility_date = "2026-07-25"
compatibility_flags = ["python_workers"]
workers_dev = false
preview_urls = false

[[routes]]
pattern = "ja.yusuke-hayashi.com"
custom_domain = true

[assets]
directory = "./public"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = [
  "/api/*",
  "/healthz",
  "/mcp",
  "/openapi.json",
]

[[d1_databases]]
binding = "DB"
database_name = "ja-translation-todo"
database_id = "36b0932a-e87b-46b6-ab61-7ee5e8e32f2b"

[[ratelimits]]
name = "WRITE_RATE_LIMITER"
namespace_id = "811381"

  [ratelimits.simple]
  limit = 30
  period = 60

[observability]
enabled = true
