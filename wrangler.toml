name = "ja-translation-todo"
main = "entry.py"
compatibility_date = "2026-07-25"
compatibility_flags = ["python_workers"]

[assets]
directory = "./public"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = [
  "/api/*",
  "/healthz",
  "/mcp",
  "/openapi.json",
]

[observability]
enabled = true
